<!doctype html>
<html lang="en-GB">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="%BASE_URL%calculator.svg" />
  <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
  <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Sora はラテンと数字、Noto Sans JP は CJK を担当する。1 リクエストにまとめる。
       Sora は可変フォント (400..700) なのでウェイト分のファイルは増えない。 -->
  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@400..700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- src/index.css の --color-page と一致させる (petrol の oklch(0.985 0.006 205) /
       oklch(0.150 0.018 205))。ずれるとモバイルのブラウザクロームだけ別の色になる。 -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6fbfc" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#030d0f" />
  <meta name="application-name" content="The Spoke Calculator" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="The Spoke Calculator" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>The Spoke Calculator</title>
  <meta name="description"
    content="Calculate bicycle spoke lengths for wheel building — from ERD, rim offset, hub PCD, flange distance, spoke count and crossings." />
  <link rel="canonical" href="https://llongmane584.github.io/the-spoke-calculator/" />
  <!-- クローラは JS を実行しないので runtime の i18n (ja) は届かない。既定の UI 言語で
       ある英語に揃える。%BASE_URL% はパスしか返さないため絶対 URL を直書きする。
       リポジトリ名変更・独自ドメイン導入時はここの URL を直すこと。
       画像を差し替えるときは ?v= ではなくファイル名を変える (og-image-5.png)。
       クエリ付き URL の扱いはスクレイパごとに違う。 -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="The Spoke Calculator" />
  <meta property="og:url" content="https://llongmane584.github.io/the-spoke-calculator/" />
  <meta property="og:title" content="The Spoke Calculator" />
  <meta property="og:description"
    content="Calculate bicycle spoke lengths for wheel building. Enter ERD, rim offset, hub PCD, flange distance, spoke count and crossings to get left and right spoke lengths." />
  <meta property="og:locale" content="en_GB" />
  <meta property="og:image" content="https://llongmane584.github.io/the-spoke-calculator/og-image-4.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="The Spoke Calculator — bicycle wheel spoke length calculator" />
  <!-- X のクローラは twitter:title / description / image が無ければ og:* に落ちる。
       ここで要るのは card 種別と、og:image:alt を読まない X 用の画像 alt だけ。 -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image:alt" content="The Spoke Calculator — bicycle wheel spoke length calculator" />
  <script>
    (function() {
      var theme = localStorage.getItem('theme');
      if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
      var storedLang = localStorage.getItem('preferredLanguage');
      document.documentElement.lang = storedLang === 'ja' ? 'ja' : 'en-GB';
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
