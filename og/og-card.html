<!doctype html>
<html lang="en-GB">

<head>
  <meta charset="UTF-8" />
  <title>OG card source</title>
  <!-- public/og-image-4.png のソース。配信物ではないので public/ には置かない
       (置くと dist/ に混ざる)。

       再生成手順 — リポジトリルートで実行する。<ABS> はリポジトリの絶対パスに置き換える:

         node og/serve.mjs                     # 別ターミナルで起動したままにする
         playwright-cli -s=og open "http://127.0.0.1:8787/og/og-card.html"
         playwright-cli -s=og resize 1320 760
         playwright-cli -s=og eval "() => document.fonts.ready.then(() => [...document.fonts].some(f => f.family === 'Sora' && f.status === 'loaded'))"
         # ↑ true が返らなければ中断する。スクリーンショットは撮らない
         playwright-cli -s=og screenshot "#card" --filename="<ABS>/public/og-image-4.png"
         playwright-cli -s=og close

       -s=og は省かない。既定セッションは人が開いているブラウザに繋がる。

       関門に document.fonts.check() を使ってはいけない (#148)。check() が見るのは
       「読み込み待ちの FontFace が残っていないか」であって「その書体で描かれるか」
       ではないので、fonts.googleapis.com へ到達できず @font-face が 1 本も生成されなかった
       場合、待つものが無いので素通しで true を返す。#146 ではこれを true で通過して、fallback で
       描かれたカードができた。上の式は face が実在して loaded であることを見るため、
       スタイルシートが落ちても woff2 だけが落ちても false になる (両方 503 で実測)。
       Google Fonts は subset ごとに @font-face を吐き、使わない subset は unloaded のまま
       残るので、every ではなく some で見る。

       関門は true なのに字送りが怪しい、というときは実際に使われた書体名を CDP で引く。
       正常なら familyName が Sora、isCustomFont が true になる:

         playwright-cli -s=og run-code "async page => { const c = await page.context().newCDPSession(page); const { root } = await c.send('DOM.getDocument'); await c.send('CSS.enable'); const { nodeId } = await c.send('DOM.querySelector', { nodeId: root.nodeId, selector: '.title' }); return (await c.send('CSS.getPlatformFontsForNode', { nodeId })).fonts }"

       playwright-cli は file: を塞いでいるので HTTP 配信が要る。vite の dev サーバーは
       public/ を base 直下に出すため ../public/calculator.svg が 404 になり代用できない
       (だから og/serve.mjs がある)。

       --filename は必ず絶対パス。相対だと gitignore 済みの .playwright-cli/ に落ちて
       何もコミットされない。resize の 1320x760 はカードが切れないための余裕で、
       要素スクショなので余白は写らない。

       出力後は 1200x630 / 300KB 未満であることを確認する。書体が Sora かどうかは
       上の関門と CDP で見る —— カード単体を目で見て Sora と fallback は見分けられない
       (#146 は旧画像と字送りを並べて測って、ようやく気づいた)。 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- 宣言しないとブラウザが /favicon.ico を取りに行き、コンソールに 404 が 1 本出る。 -->
  <link rel="icon" href="data:," />
  <!-- display=swap ではなく block。@font-face が生成されたうえで woff2 が遅い / 落ちる
       ときは、文字が「消える」ので失敗が目で分かる (swap だと fallback でそれらしく
       描かれた PNG ができてしまう)。
       ただしスタイルシート自体が届かなければ block は効かない。@font-face が 1 本も
       無いので、待つものが無く最初から fallback で静かに描かれる —— #146 で実際に
       そうなった。block だけでは足りないので、上の手順に関門がある。 -->
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400..600&display=block" rel="stylesheet" />
  <style>
    /* 色は src/index.css のライトテーマ値を写したもの。ここはアプリの CSS ではなく
       Tailwind も通らないので、セマンティックトークンではなく生の hex で書く。
         #f6fbfc  --color-page      #0a2225  --color-fg
         #4a5f62  --color-fg-muted  #006a72  --color-accent */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #d5e3e5;
      display: flex;
      justify-content: center;
      padding: 40px;
    }

    /* 背景は単色。グラデーションは付けない。
       本文は縦中央に寄せ、URL だけ下端に固定する。space-between だと 3 ブロックの
       間に均等な空白ができて中央が間延びする。
       padding-bottom が top より大きいのは、フローから外した .url の場所を空けておく
       ため。ここを top と揃えると、中央寄せされた本文の下端が .url に重なる。 */
    #card {
      position: relative;
      width: 1200px;
      height: 630px;
      padding: 76px 88px 132px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 44px;
      background: #f6fbfc;
      font-family: "Sora", sans-serif;
      color: #0a2225;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* 下端のアクセント帯。装飾のみなので、万一クロップされても情報は失われない。 */
    #card::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 10px;
      background: #006a72;
    }

    .lockup {
      display: flex;
      align-items: center;
      gap: 36px;
    }

    /* アイコンは見出しの「字面」に合わせる —— 上端が The のキャップトップ、下端が
       Calculator のベースライン。行ボックス (72px x 1.08 x 3 = 233.28px) に合わせると、
       字面は行ボックスの中で上下に偏っているぶん、アイコンだけ 22px 大きく見える。

       211px と 10px は描画結果から測った値で、書体・--title-size・line-height の
       どれかを変えたら合わなくなる。変えたときは撮り直して og/ink.mjs で測り直すこと
       (使い方はそのファイルの冒頭)。両方の ink の高さと y 範囲が一致すれば正しい。

       width は viewBox (822x834) から導かせる —— 数値で置くと比率がずれる。 */
    .lockup img {
      align-self: flex-start;
      margin-top: 10px;
      height: 211px;
      width: auto;
      display: block;
    }

    /* 3 段組みなので 1 行あたりは 84px から落としてある。84px のままだと見出しの
       高さが 272px になり、下の本文と URL に回す余白が残らない。 */
    .title {
      font-size: 72px;
      font-weight: 600;
      line-height: 1.08;
      letter-spacing: -0.02em;
    }

    .sub {
      font-size: 36px;
      font-weight: 400;
      line-height: 1.3;
      color: #4a5f62;
    }

    .detail {
      margin-top: 14px;
      font-size: 26px;
      font-weight: 400;
      line-height: 1.3;
      color: #4a5f62;
      opacity: 0.85;
    }

    .url {
      position: absolute;
      left: 88px;
      bottom: 76px;
      font-size: 26px;
      font-weight: 500;
      letter-spacing: 0.01em;
      color: #006a72;
    }
  </style>
</head>

<body>
  <div id="card">
    <div class="lockup">
      <!-- file:// から file:// の <img> は Chromium で読める (塞がれるのは fetch/XHR)。
           空白で出た場合は public/icons/icon-512.png に差し替える。同じ図案。 -->
      <img src="../public/calculator.svg" alt="" />
      <div class="title">The<br />Spoke<br />Calculator</div>
    </div>
    <div>
      <div class="sub">Calculate bicycle spoke lengths for wheel building</div>
      <div class="detail">ERD &middot; Rim offset &middot; Hub PCD &middot; Flange distance &middot; Crossings</div>
    </div>
    <div class="url">llongmane584.github.io/the-spoke-calculator</div>
  </div>
</body>

</html>
